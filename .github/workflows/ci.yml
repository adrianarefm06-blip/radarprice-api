name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Tests
        run: pytest tests/ -q

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: radarprice
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: radarprice
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radarprice" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RADARPRICE_TEST_POSTGRES_URL: postgresql://radarprice:secret@localhost:5432/radarprice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests contra PostgreSQL
        run: pytest tests/test_postgres.py -q -rs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t radarprice-api:ci .
      - name: Arrancar y comprobar /health
        run: |
          docker run -d --name api -p 8000:8000 radarprice-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
