name: Sonda de scrapers

# Ejecuta los scrapers reales contra las webs de las tiendas desde un runner de GitHub
# e imprime un informe (tallas, stock, precio mínimo o error por SKU). No falla si una
# tienda cambia: es diagnóstico. Se lanza a mano o al tocar los scrapers.
on:
  workflow_dispatch:
    inputs:
      args:
        description: "Argumentos de scripts/probe_live.py (vacío = todas las tiendas reales)"
        required: false
        default: ""
  push:
    branches-ignore: [main]
    paths:
      - "app/scrapers/**"
      - "scripts/probe_live.py"
      - ".github/workflows/scraper-probe.yml"

permissions:
  contents: read

concurrency:
  group: scraper-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Sonda
        env:
          ARGS: ${{ github.event.inputs.args || '--no-stores --find-image DH6927-111 --find-image DD1503-101 --find-image BB550WT1' }}
        run: python -m scripts.probe_live $ARGS
